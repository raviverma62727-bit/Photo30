<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090f">
<title>PixelForge AI — Photo Editor</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07080c;
  --panel:#0d1016;
  --panel2:#12161e;
  --panel3:#181d27;
  --border:#292f3a;
  --text:#f4f6fa;
  --muted:#8993a2;
  --accent:#7467ff;
  --accent2:#4d8dff;
  --green:#32d59b;
  --danger:#ff5570;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */

.topbar{
  height:64px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 18px;
  background:rgba(10,12,17,.96);
  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
}

.logo-icon{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,#7c6cff,#4d8cff);
  box-shadow:0 8px 25px rgba(116,103,255,.3);
}

.logo span{
  color:#8c81ff;
}

.project{
  color:var(--muted);
  font-size:12px;
  border-left:1px solid var(--border);
  padding-left:18px;
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.btn{
  height:36px;
  padding:0 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--panel3);
  color:var(--text);
  font-size:12px;
  font-weight:700;
}

.btn:hover{
  background:#202632;
}

.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:0;
}

.icon-btn{
  width:36px;
  height:36px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--panel3);
  color:white;
}

/* WORKSPACE */

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:245px minmax(0,1fr) 290px;
}

/* SIDEBARS */

.sidebar{
  min-width:0;
  min-height:0;
  background:var(--panel);
  overflow:hidden;
}

.left{
  border-right:1px solid var(--border);
}

.right{
  border-left:1px solid var(--border);
}

.panel-title{
  height:48px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid var(--border);
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
  color:#c4cad3;
}

.panel-content{
  height:calc(100% - 48px);
  overflow-y:auto;
  padding:13px;
}

/* LEFT TOOLS */

.search{
  width:100%;
  height:36px;
  padding:0 11px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#11151c;
  color:white;
  outline:none;
  margin-bottom:12px;
}

.tools{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.tool{
  width:100%;
  min-height:45px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:7px 10px;
  border-radius:8px;
  border:1px solid transparent;
  background:transparent;
  color:#aab2bf;
  text-align:left;
}

.tool:hover{
  background:var(--panel3);
  color:white;
}

.tool.active{
  background:rgba(116,103,255,.14);
  border-color:rgba(116,103,255,.35);
  color:white;
}

.tool-icon{
  width:27px;
  text-align:center;
  font-size:17px;
}

.tool strong{
  display:block;
  font-size:12px;
}

.tool small{
  display:block;
  color:#697383;
  margin-top:2px;
  font-size:9px;
}

/* CENTER */

.center{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#080a0e;
}

.canvas-area{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(
      circle at center,
      #1a202a 0,
      #0d1117 42%,
      #07080c 80%
    );
}

.checker{
  position:absolute;
  inset:0;
  opacity:.1;
  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:36px 36px;
}

.stage{
  position:relative;
  width:min(84%,950px);
  height:min(78%,650px);
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  border:1px solid #292f38;
  border-radius:5px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.65);
}

#editorCanvas{
  display:block;
  max-width:100%;
  max-height:100%;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  pointer-events:none;
  color:#737e8d;
}

.empty-icon{
  font-size:52px;
}

.empty strong{
  color:#dce1e8;
  font-size:15px;
}

.empty span{
  font-size:11px;
}

/* CANVAS BUTTONS */

.canvas-controls{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px;
  background:rgba(12,15,20,.9);
  border:1px solid var(--border);
  border-radius:10px;
  backdrop-filter:blur(14px);
  z-index:5;
}

.canvas-controls button{
  min-width:35px;
  height:31px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#dce2e9;
}

.canvas-controls button:hover{
  background:var(--panel3);
}

/* BOTTOM */

.statusbar{
  height:43px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 13px;
  background:#0d1015;
  border-top:1px solid var(--border);
  color:#7f8997;
  font-size:10px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(50,213,155,.6);
}

.status-right{
  margin-left:auto;
}

/* RIGHT PANEL */

.section{
  padding-bottom:17px;
  margin-bottom:17px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.section:last-child{
  border-bottom:0;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  color:#c2c9d2;
  font-size:10px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.control{
  margin-bottom:13px;
}

.control:last-child{
  margin-bottom:0;
}

.control label{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
  color:#8c96a4;
  font-size:10px;
}

.control output{
  color:#d8dee6;
}

.range{
  width:100%;
  height:4px;
  appearance:none;
  background:#2a3039;
  border-radius:10px;
}

.range::-webkit-slider-thumb{
  appearance:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:white;
  border:3px solid var(--accent);
}

.select,
.text-input{
  width:100%;
  height:36px;
  padding:0 10px;
  border-radius:7px;
  border:1px solid var(--border);
  background:#151a21;
  color:white;
  outline:none;
  font-size:11px;
}

/* UPLOAD */

.upload-box{
  min-height:145px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  border:1px dashed #46505f;
  border-radius:10px;
  background:linear-gradient(145deg,#11161d,#0c1015);
  color:#8d97a5;
  cursor:pointer;
  text-align:center;
  transition:.2s;
}

.upload-box:hover,
.upload-box.drag{
  border-color:var(--accent);
  background:rgba(116,103,255,.08);
}

.upload-box .upload-icon{
  font-size:30px;
}

.upload-box strong{
  color:#e8ecf1;
  font-size:12px;
}

.upload-box small{
  font-size:9px;
}

#photoInput{
  display:none;
}

/* FILTERS */

.filter-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.filter{
  height:54px;
  border-radius:7px;
  border:1px solid var(--border);
  color:white;
  font-size:9px;
  font-weight:700;
  text-shadow:0 1px 5px #000;
}

.filter[data-filter="original"]{
  background:#444;
}

.filter[data-filter="warm"]{
  background:linear-gradient(135deg,#ffbd73,#a64d3d);
}

.filter[data-filter="cool"]{
  background:linear-gradient(135deg,#54c7ff,#3550bd);
}

.filter[data-filter="cinema"]{
  background:linear-gradient(135deg,#55432f,#1b2521);
}

.filter[data-filter="vintage"]{
  background:linear-gradient(135deg,#b98652,#59432e);
}

.filter[data-filter="neon"]{
  background:linear-gradient(135deg,#ff32d6,#283cff);
}

.filter.active{
  border:2px solid white;
}

/* STICKERS */

.stickers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.sticker{
  height:43px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--panel3);
  font-size:21px;
}

.sticker:hover{
  border-color:var(--accent);
  transform:scale(1.04);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(470px,92%);
  background:#11151b;
  border:1px solid #353c48;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.modal-header{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--border);
}

.modal-header strong{
  font-size:13px;
}

.modal-body{
  padding:18px;
}

.export-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:15px;
}

.export-choice{
  padding:15px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--panel3);
  color:white;
  text-align:left;
}

.export-choice.active{
  border-color:var(--accent);
  background:rgba(116,103,255,.12);
}

.export-choice strong{
  display:block;
  font-size:12px;
}

.export-choice small{
  color:var(--muted);
  font-size:9px;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:62px;
  z-index:200;
  padding:11px 15px;
  border-radius:8px;
  background:#181d25;
  border:1px solid #38404c;
  color:white;
  font-size:11px;
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:1050px){

  .workspace{
    grid-template-columns:210px minmax(0,1fr) 260px;
  }

}

@media(max-width:800px){

  html,body{
    overflow:auto;
  }

  .workspace{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(450px,1fr) auto;
  }

  .sidebar{
    border:0;
    border-bottom:1px solid var(--border);
  }

  .left{
    max-height:220px;
  }

  .right{
    max-height:480px;
  }

  .project{
    display:none;
  }

}

@media(max-width:500px){

  .topbar{
    padding:0 9px;
  }

  .logo{
    font-size:14px;
  }

  .logo-icon{
    width:29px;
    height:29px;
  }

  .top-actions .btn:not(.primary),
  .top-actions .icon-btn{
    display:none;
  }

  .stage{
    width:94%;
    height:70%;
  }

}
</style>
</head>

<body>

<div id="app">

<header class="topbar">

  <div class="logo">
    <div class="logo-icon">✦</div>
    Pixel<span>Forge</span> AI
  </div>

  <div class="project">
    Untitled Photo Project
  </div>

  <div class="top-actions">

    <button class="icon-btn" id="undoBtn">↶</button>

    <button class="icon-btn" id="redoBtn">↷</button>

    <button class="btn" id="resetBtn">
      Reset
    </button>

    <button class="btn primary" id="exportBtn">
      Export
    </button>

  </div>

</header>


<div class="workspace">


<!-- LEFT -->

<aside class="sidebar left">

  <div class="panel-title">
    TOOLS
  </div>

  <div class="panel-content">

    <input
      id="toolSearch"
      class="search"
      type="text"
      placeholder="Search tools..."
    >

    <div class="tools">

      <button class="tool active">
        <span class="tool-icon">✨</span>
        <span>
          <strong>AI Enhance</strong>
          <small>Improve details</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">◒</span>
        <span>
          <strong>Adjust</strong>
          <small>Light & color</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">🎨</span>
        <span>
          <strong>Filters</strong>
          <small>Creative looks</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">T</span>
        <span>
          <strong>Text</strong>
          <small>Add typography</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">⭐</span>
        <span>
          <strong>Stickers</strong>
          <small>Add decorations</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">✦</span>
        <span>
          <strong>Effects</strong>
          <small>Visual effects</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">⚡</span>
        <span>
          <strong>Animation</strong>
          <small>Motion preview</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">⌗</span>
        <span>
          <strong>Crop</strong>
          <small>Frame image</small>
        </span>
      </button>

    </div>

  </div>

</aside>


<!-- CENTER -->

<main class="center">

  <div class="canvas-area">

    <div class="checker"></div>

    <div class="stage" id="stage">

      <canvas id="editorCanvas"></canvas>

      <div class="empty" id="emptyState">

        <div class="empty-icon">⌁</div>

        <strong>
          Import a photo to start
        </strong>

        <span>
          JPG, PNG or WEBP
        </span>

      </div>

    </div>


    <div class="canvas-controls">

      <button id="zoomOut">−</button>

      <button id="zoomText">
        100%
      </button>

      <button id="zoomIn">+</button>

      <button id="fitBtn">⛶</button>

      <button id="beforeBtn">◐</button>

    </div>

  </div>


  <div class="statusbar">

    <span class="status-dot"></span>

    <span id="statusText">
      Ready — Import a photo
    </span>

    <span class="status-right">
      <span id="resolutionText">
        No image
      </span>

      &nbsp;•&nbsp;

      <span id="zoomStatus">
        100%
      </span>
    </span>

  </div>

</main>


<!-- RIGHT -->

<aside class="sidebar right">

  <div class="panel-title">
    PROPERTIES
  </div>

  <div class="panel-content">


    <!-- IMPORT -->

    <div class="section">

      <div class="section-title">
        <span>Photo</span>
      </div>

      <label class="upload-box" id="uploadBox">

        <input
          id="photoInput"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <div class="upload-icon">↥</div>

        <strong>
          Import Photo
        </strong>

        <small>
          Click or drag & drop
        </small>

      </label>

    </div>


    <!-- AI -->

    <div class="section">

      <div class="section-title">
        <span>AI Enhancement</span>
        <span>AI</span>
      </div>

      <div class="control">

        <label>
          <span>Enhancement</span>
          <output id="enhanceValue">75</output>
        </label>

        <input
          class="range"
          id="enhance"
          type="range"
          min="0"
          max="100"
          value="75"
        >

      </div>

      <div class="control">

        <label>
          <span>Detail Recovery</span>
          <output id="detailValue">50</output>
        </label>

        <input
          class="range"
          id="detail"
          type="range"
          min="0"
          max="100"
          value="50"
        >

      </div>

      <div class="control">

        <label>
          <span>Noise Reduction</span>
          <output id="noiseValue">20</output>
        </label>

        <input
          class="range"
          id="noise"
          type="range"
          min="0"
          max="100"
          value="20"
        >

      </div>

    </div>


    <!-- COLOR -->

    <div class="section">

      <div class="section-title">
        <span>Color</span>
      </div>

      <div class="control">

        <label>
          <span>Brightness</span>
          <output id="brightnessValue">0</output>
        </label>

        <input
          class="range"
          id="brightness"
          type="range"
          min="-100"
          max="100"
          value="0"
        >

      </div>

      <div class="control">

        <label>
          <span>Contrast</span>
          <output id="contrastValue">0</output>
        </label>

        <input
          class="range"
          id="contrast"
          type="range"
          min="-100"
          max="100"
          value="0"
        >

      </div>

      <div class="control">

        <label>
          <span>Saturation</span>
          <output id="saturationValue">0</output>
        </label>

        <input
          class="range"
          id="saturation"
          type="range"
          min="-100"
          max="100"
          value="0"
        >

      </div>

    </div>


    <!-- FILTERS -->

    <div class="section">

      <div class="section-title">
        <span>Filters</span>
      </div>

      <div class="filter-grid">

        <button class="filter active"
                data-filter="original">
          Original
        </button>

        <button class="filter"
                data-filter="warm">
          Warm
        </button>

        <button class="filter"
                data-filter="cool">
          Cool
        </button>

        <button class="filter"
                data-filter="cinema">
          Cinema
        </button>

        <button class="filter"
                data-filter="vintage">
          Vintage
        </button>

        <button class="filter"
                data-filter="neon">
          Neon
        </button>

      </div>

    </div>


    <!-- TEXT -->

    <div class="section">

      <div class="section-title">
        <span>Text</span>
      </div>

      <input
        class="text-input"
        id="textInput"
        type="text"
        placeholder="Type something..."
        maxlength="80"
      >

      <br><br>

      <select class="select" id="textStyle">

        <option value="normal">
          Normal
        </option>

        <option value="bold">
          Bold
        </option>

        <option value="neon">
          Neon
        </option>

        <option value="shadow">
          Shadow
        </option>

      </select>

    </div>


    <!-- STICKERS -->

    <div class="section">

      <div class="section-title">
        <span>Stickers</span>
      </div>

      <div class="stickers">

        <button class="sticker">🔥</button>
        <button class="sticker">✨</button>
        <button class="sticker">❤️</button>
        <button class="sticker">⭐</button>
        <button class="sticker">💎</button>
        <button class="sticker">🌈</button>
        <button class="sticker">⚡</button>
        <button class="sticker">🎀</button>

      </div>

    </div>


    <!-- OUTPUT -->

    <div class="section">

      <div class="section-title">
        <span>Output</span>
      </div>

      <select class="select" id="outputSize">

        <option value="original">
          Original Resolution
        </option>

        <option value="1080">
          Full HD — 1920 × 1080
        </option>

        <option value="4k">
          4K UHD — 3840 × 2160
        </option>

      </select>

    </div>


  </div>

</aside>

</div>

</div>


<!-- EXPORT MODAL -->

<div class="modal" id="exportModal">

  <div class="modal-box">

    <div class="modal-header">

      <strong>
        Export Photo
      </strong>

      <button class="icon-btn"
              id="closeExport">
        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="export-grid">

        <button
          class="export-choice active"
          data-export="4k">

          <strong>
            4K UHD
          </strong>

          <small>
            3840 × 2160
          </small>

        </button>

        <button
          class="export-choice"
          data-export="1080">

          <strong>
            Full HD
          </strong>

          <small>
            1920 × 1080
          </small>

        </button>

      </div>

      <button
        class="btn primary"
        id="downloadBtn"
        style="width:100%;height:43px">

        Download PNG

      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast">
  Done
</div>


<script>
"use strict";

const App = {

  canvas:null,
  ctx:null,

  image:null,
  originalImage:null,

  zoom:1,
  showingBefore:false,

  exportMode:"4k",

  filter:"original",

  text:"",
  textStyle:"normal",

  stickers:[],

  settings:{
    enhance:75,
    detail:50,
    noise:20,
    brightness:0,
    contrast:0,
    saturation:0
  },

  init(){

    this.canvas=
      document.getElementById("editorCanvas");

    this.ctx=
      this.canvas.getContext("2d");

    this.bindUpload();
    this.bindControls();
    this.bindFilters();
    this.bindText();
    this.bindStickers();
    this.bindTools();
    this.bindExport();

    this.resizeCanvas();

    window.addEventListener(
      "resize",
      ()=>{
        this.resizeCanvas();
        this.render();
      }
    );

    this.setStatus(
      "Ready — Import a photo"
    );

  },


  /* =========================
     PHOTO IMPORT
     ========================= */

  bindUpload(){

    const input=
      document.getElementById("photoInput");

    const box=
      document.getElementById("uploadBox");


    box.addEventListener(
      "click",
      ()=>{
        input.click();
      }
    );


    input.addEventListener(
      "change",
      event=>{

        const file=
          event.target.files &&
          event.target.files[0];

        if(file){
          this.loadImage(file);
        }

      }
    );


    box.addEventListener(
      "dragover",
      event=>{

        event.preventDefault();

        box.classList.add("drag");

      }
    );


    box.addEventListener(
      "dragleave",
      ()=>{

        box.classList.remove("drag");

      }
    );


    box.addEventListener(
      "drop",
      event=>{

        event.preventDefault();

        box.classList.remove("drag");

        const file=
          event.dataTransfer.files &&
          event.dataTransfer.files[0];

        if(
          file &&
          file.type.startsWith("image/")
        ){

          this.loadImage(file);

        }else{

          this.toast(
            "Please select an image"
          );

        }

      }
    );

  },


  loadImage(file){

    if(
      !file ||
      !file.type.startsWith("image/")
    ){

      this.toast(
        "Invalid image file"
      );

      return;
    }


    this.setStatus(
      "Loading photo..."
    );


    const reader=
      new FileReader();


    reader.onload=
      event=>{

        const img=
          new Image();


        img.onload=()=>{

          this.image=img;

          this.originalImage=img;

          this.zoom=1;

          document
            .getElementById("emptyState")
            .style.display="none";


          document
            .getElementById("resolutionText")
            .textContent=
              img.naturalWidth+
              " × "+
              img.naturalHeight;


          this.resizeCanvas();

          this.render();

          this.setStatus(
            "Photo loaded successfully"
          );

          this.toast(
            "Photo imported"
          );

        };


        img.onerror=()=>{

          this.toast(
            "Could not load image"
          );

          this.setStatus(
            "Image loading failed"
          );

        };


        img.src=event.target.result;

      };


    reader.onerror=()=>{

      this.toast(
        "Could not read file"
      );

    };


    reader.readAsDataURL(file);

  },


  /* =========================
     CANVAS
     ========================= */

  resizeCanvas(){

    const rect=
      document
        .getElementById("stage")
        .getBoundingClientRect();


    const width=
      Math.max(
        1,
        Math.floor(rect.width)
      );


    const height=
      Math.max(
        1,
        Math.floor(rect.height)
      );


    const dpr=
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    this.canvas.width=
      width*dpr;

    this.canvas.height=
      height*dpr;

    this.canvas.style.width=
      width+"px";

    this.canvas.style.height=
      height+"px";


    this.ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

  },


  render(){

    const ctx=this.ctx;

    const width=
      this.canvas.clientWidth;

    const height=
      this.canvas.clientHeight;


    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    if(!this.image){

      return;

    }


    const image=
      this.showingBefore
        ? this.originalImage
        : this.image;


    const iw=image.naturalWidth;
    const ih=image.naturalHeight;


    const scale=
      Math.min(
        width/iw,
        height/ih
      );


    const drawWidth=
      iw*scale*this.zoom;

    const drawHeight=
      ih*scale*this.zoom;


    const x=
      (width-drawWidth)/2;

    const y=
      (height-drawHeight)/2;


    ctx.save();


    if(!this.showingBefore){

      ctx.filter=
        this.getFilter();

    }else{

      ctx.filter="none";

    }


    ctx.drawImage(
      image,
      x,
      y,
      drawWidth,
      drawHeight
    );


    ctx.restore();


    if(!this.showingBefore){

      this.drawText();

      this.drawStickers();

    }

  },


  getFilter(){

    const brightness=
      100+
      this.settings.brightness;


    const contrast=
      100+
      this.settings.contrast+
      Math.round(
        this.settings.enhance*.15
      );


    const saturation=
      100+
      this.settings.saturation+
      Math.round(
        this.settings.enhance*.1
      );


    let filter=
      "brightness("+
      brightness+
      "%) "+
      "contrast("+
      contrast+
      "%) "+
      "saturate("+
      saturation+
      "%)";


    switch(this.filter){

      case "warm":

        filter+=
          " sepia(15%) saturate(120%)";

        break;


      case "cool":

        filter+=
          " hue-rotate(12deg) saturate(108%)";

        break;


      case "cinema":

        filter+=
          " contrast(115%) saturate(88%)";

        break;


      case "vintage":

        filter+=
          " sepia(32%) contrast(106%)";

        break;


      case "neon":

        filter+=
          " saturate(155%) contrast(115%)";

        break;

    }


    return filter;

  },


  /* =========================
     TEXT
     ========================= */

  bindText(){

    const input=
      document.getElementById("textInput");

    const style=
      document.getElementById("textStyle");


    input.addEventListener(
      "input",
      ()=>{

        this.text=input.value;

        this.render();

      }
    );


    style.addEventListener(
      "change",
      ()=>{

        this.textStyle=style.value;

        this.render();

      }
    );

  },


  drawText(){

    if(!this.text){

      return;

    }


    const ctx=this.ctx;

    const width=
      this.canvas.clientWidth;

    const height=
      this.canvas.clientHeight;


    ctx.save();

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    let size=44;

    let weight="700";


    if(this.textStyle==="bold"){

      size=56;
      weight="900";

    }


    if(this.textStyle==="neon"){

      size=48;
      weight="800";

      ctx.shadowColor="#7568ff";
      ctx.shadowBlur=24;

    }


    if(this.textStyle==="shadow"){

      size=48;
      weight="800";

      ctx.shadowColor="rgba(0,0,0,.9)";
      ctx.shadowBlur=16;
      ctx.shadowOffsetY=7;

    }


    ctx.font=
      weight+
      " "+
      size+
      "px Arial";


    ctx.fillStyle="#ffffff";


    ctx.fillText(
      this.text,
      width/2,
      height*.82
    );


    ctx.restore();

  },


  /* =========================
     STICKERS
     ========================= */

  bindStickers(){

    document
      .querySelectorAll(".sticker")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            this.stickers.push({
              value:button.textContent,
              x:.5,
              y:.5
            });

            this.render();

            this.toast(
              "Sticker added"
            );

          }
        );

      });

  },


  drawStickers(){

    const ctx=this.ctx;

    const width=
      this.canvas.clientWidth;

    const height=
      this.canvas.clientHeight;


    ctx.save();

    ctx.font="48px sans-serif";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    this.stickers.forEach(
      sticker=>{

        ctx.fillText(
          sticker.value,
          width*sticker.x,
          height*sticker.y
        );

      }
    );


    ctx.restore();

  },


  /* =========================
     SLIDERS
     ========================= */

  bindControls(){

    const ids=[
      "enhance",
      "detail",
      "noise",
      "brightness",
      "contrast",
      "saturation"
    ];


    ids.forEach(id=>{

      const input=
        document.getElementById(id);

      const output=
        document.getElementById(
          id+"Value"
        );


      input.addEventListener(
        "input",
        ()=>{

          this.settings[id]=
            Number(input.value);

          output.textContent=
            input.value;

          this.render();

        }
      );

    });

  },


  /* =========================
     FILTERS
     ========================= */

  bindFilters(){

    document
      .querySelectorAll(".filter")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            document
              .querySelectorAll(".filter")
              .forEach(
                x=>x.classList.remove("active")
              );


            button.classList.add("active");

            this.filter=
              button.dataset.filter;

            this.render();

            this.toast(
              button.textContent.trim()+
              " filter applied"
            );

          }
        );

      });

  },


  /* =========================
     TOOL SEARCH
     ========================= */

  bindTools(){

    const search=
      document.getElementById(
        "toolSearch"
      );


    search.addEventListener(
      "input",
      ()=>{

        const query=
          search.value.toLowerCase();


        document
          .querySelectorAll(".tool")
          .forEach(tool=>{

            const text=
              tool.textContent.toLowerCase();


            tool.style.display=
              text.includes(query)
                ? "flex"
                : "none";

          });

      }
    );


    document
      .querySelectorAll(".tool")
      .forEach(tool=>{

        tool.addEventListener(
          "click",
          ()=>{

            document
              .querySelectorAll(".tool")
              .forEach(
                x=>x.classList.remove("active")
              );


            tool.classList.add("active");

            this.toast(
              tool.querySelector("strong")
                .textContent+
              " selected"
            );

          }
        );

      });

  },


  /* =========================
     ZOOM
     ========================= */

  updateZoom(){

    const percent=
      Math.round(
        this.zoom*100
      )+"%";


    document.getElementById(
      "zoomText"
    ).textContent=percent;


    document.getElementById(
      "zoomStatus"
    ).textContent=percent;


    this.render();

  },


  /* =========================
     EXPORT
     ========================= */

  bindExport(){

    document
      .getElementById("exportBtn")
      .addEventListener(
        "click",
        ()=>this.openExport()
      );


    document
      .getElementById("closeExport")
      .addEventListener(
        "click",
        ()=>this.closeExport()
      );


    document
      .getElementById("downloadBtn")
      .addEventListener(
        "click",
        ()=>this.download()
      );


    document
      .querySelectorAll(".export-choice")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            document
              .querySelectorAll(
                ".export-choice"
              )
              .forEach(
                x=>x.classList.remove("active")
              );


            button.classList.add("active");

            this.exportMode=
              button.dataset.export;

          }
        );

      });

  },


  openExport(){

    if(!this.image){

      this.toast(
        "Import a photo first"
      );

      return;

    }


    document
      .getElementById("exportModal")
      .classList.add("show");

  },


  closeExport(){

    document
      .getElementById("exportModal")
      .classList.remove("show");

  },


  download(){

    if(!this.image){

      this.toast(
        "Import a photo first"
      );

      return;

    }


    const output=
      document.getElementById(
        "outputSize"
      ).value;


    let width;
    let height;


    if(output==="4k"){

      width=3840;
      height=2160;

    }else if(output==="1080"){

      width=1920;
      height=1080;

    }else{

      width=this.image.naturalWidth;
      height=this.image.naturalHeight;

    }


    if(output==="original"){

      width=this.image.naturalWidth;
      height=this.image.naturalHeight;

    }


    const canvas=
      document.createElement("canvas");


    canvas.width=width;
    canvas.height=height;


    const ctx=
      canvas.getContext("2d");


    const iw=
      this.image.naturalWidth;

    const ih=
      this.image.naturalHeight;


    const scale=
      Math.min(
        width/iw,
        height/ih
      );


    const w=iw*scale;
    const h=ih*scale;

    const x=(width-w)/2;
    const y=(height-h)/2;


    ctx.save();

    ctx.filter=
      this.getFilter();

    ctx.drawImage(
      this.image,
      x,
      y,
      w,
      h
    );

    ctx.restore();


    /* TEXT */

    if(this.text){

      ctx.save();

      let fontSize=
        Math.round(width*.035);


      if(this.textStyle==="bold"){
        fontSize=
          Math.round(width*.045);
      }


      ctx.font=
        "800 "+
        fontSize+
        "px Arial";


      ctx.textAlign="center";

      ctx.textBaseline="middle";

      if(this.textStyle==="neon"){

        ctx.shadowColor="#7568ff";
        ctx.shadowBlur=25;

      }

      if(this.textStyle==="shadow"){

        ctx.shadowColor=
          "rgba(0,0,0,.9)";

        ctx.shadowBlur=18;
        ctx.shadowOffsetY=7;

      }


      ctx.fillStyle="#fff";

      ctx.fillText(
        this.text,
        width/2,
        height*.82
      );

      ctx.restore();

    }


    /* STICKERS */

    this.stickers.forEach(
      sticker=>{

        ctx.save();

        ctx.font=
          Math.round(width*.045)+
          "px sans-serif";

        ctx.textAlign="center";

        ctx.textBaseline="middle";

        ctx.fillText(
          sticker.value,
          width*sticker.x,
          height*sticker.y
        );

        ctx.restore();

      }
    );


    canvas.toBlob(
      blob=>{

        if(!blob){

          this.toast(
            "Export failed"
          );

          return;

        }


        const url=
          URL.createObjectURL(blob);


        const link=
          document.createElement("a");


        link.href=url;

        link.download=
          "pixelforge-"+
          width+
          "x"+
          height+
          ".png";


        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(
          ()=>URL.revokeObjectURL(url),
          1000
        );


        this.closeExport();

        this.toast(
          "PNG exported successfully"
        );

      },
      "image/png"
    );

  },


  /* =========================
     BUTTONS
     ========================= */

  bindButtons(){

  },


  /* =========================
     RESET
     ========================= */

  reset(){

    this.settings={
      enhance:75,
      detail:50,
      noise:20,
      brightness:0,
      contrast:0,
      saturation:0
    };


    this.filter="original";

    this.text="";

    this.textStyle="normal";

    this.stickers=[];


    const values={
      enhance:75,
      detail:50,
      noise:20,
      brightness:0,
      contrast:0,
      saturation:0
    };


    Object.keys(values).forEach(id=>{

      const input=
        document.getElementById(id);

      const output=
        document.getElementById(
          id+"Value"
        );


      input.value=values[id];

      output.textContent=values[id];

    });


    document.getElementById(
      "textInput"
    ).value="";


    document.getElementById(
      "textStyle"
    ).value="normal";


    document
      .querySelectorAll(".filter")
      .forEach(
        x=>x.classList.remove("active")
      );


    document
      .querySelector(
        '[data-filter="original"]'
      )
      .classList.add("active");


    this.render();

    this.toast(
      "All edits reset"
    );

  },


  /* =========================
     STATUS
     ========================= */

  setStatus(message){

    document.getElementById(
      "statusText"
    ).textContent=message;

  },


  toast(message){

    const toast=
      document.getElementById("toast");


    toast.textContent=message;

    toast.classList.add("show");


    clearTimeout(this.toastTimer);


    this.toastTimer=
      setTimeout(
        ()=>{
          toast.classList.remove("show");
        },
        2200
      );

  }

};


/* =========================
   GLOBAL BUTTON EVENTS
   ========================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    ()=>{

      App.zoom=
        Math.min(
          3,
          App.zoom+.1
        );

      App.updateZoom();

    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    ()=>{

      App.zoom=
        Math.max(
          .25,
          App.zoom-.1
        );

      App.updateZoom();

    }
  );


document
  .getElementById("fitBtn")
  .addEventListener(
    "click",
    ()=>{

      App.zoom=1;

      App.updateZoom();

    }
  );


document
  .getElementById("beforeBtn")
  .addEventListener(
    "mousedown",
    ()=>{

      App.showingBefore=true;

      App.render();

    }
  );


document
  .getElementById("beforeBtn")
  .addEventListener(
    "mouseup",
    ()=>{

      App.showingBefore=false;

      App.render();

    }
  );


document
  .getElementById("beforeBtn")
  .addEventListener(
    "mouseleave",
    ()=>{

      App.showingBefore=false;

      App.render();

    }
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    ()=>App.reset()
  );


/* Prevent modal closing accidentally
   while clicking inside the box */

document
  .getElementById("exportModal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target.id==="exportModal"
      ){

        App.closeExport();

      }

    }
  );


/* START */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    App.init();
  }
);

</script>

</body>
</html>
