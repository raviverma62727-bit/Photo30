<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>PixelForge AI — Professional Photo Editor</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07080c;
  --panel:#0d1016;
  --panel2:#12161e;
  --panel3:#181d26;
  --line:#282e39;
  --text:#f4f6fa;
  --muted:#87909d;
  --accent:#7568ff;
  --accent2:#4e8cff;
  --green:#35d39a;
  --red:#ff5b76;
  --radius:10px;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* ================= APP ================= */

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ================= TOP BAR ================= */

.topbar{
  height:62px;
  flex:none;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 18px;
  background:rgba(10,12,17,.96);
  border-bottom:1px solid var(--line);
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:850;
  letter-spacing:-.04em;
  white-space:nowrap;
}

.logo-mark{
  width:32px;
  height:32px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#786cff,#4d83ff);
  box-shadow:0 8px 25px rgba(117,104,255,.35);
}

.logo span{
  color:#8c82ff;
}

.project{
  color:var(--muted);
  font-size:12px;
  border-left:1px solid var(--line);
  padding-left:18px;
}

.top-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.btn,
.icon-btn{
  height:35px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel3);
  color:var(--text);
  transition:.18s ease;
}

.btn{
  padding:0 13px;
  font-size:12px;
  font-weight:700;
}

.icon-btn{
  width:35px;
  display:grid;
  place-items:center;
}

.btn:hover,
.icon-btn:hover{
  background:#202631;
  border-color:#394150;
}

.btn.primary{
  border-color:transparent;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 7px 25px rgba(117,104,255,.25);
}

/* ================= WORKSPACE ================= */

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:240px minmax(0,1fr) 290px;
}

/* ================= SIDEBAR ================= */

.sidebar{
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:var(--panel);
}

.left{
  border-right:1px solid var(--line);
}

.right{
  border-left:1px solid var(--line);
}

.panel-title{
  height:48px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid var(--line);
  color:#cbd1da;
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
}

.panel-content{
  height:calc(100% - 48px);
  overflow:auto;
  padding:13px;
}

/* ================= TOOLS ================= */

.search{
  width:100%;
  height:36px;
  margin-bottom:12px;
  padding:0 11px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#11151c;
  color:white;
}

.tools{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.tool{
  width:100%;
  min-height:45px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  color:#aab2be;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  text-align:left;
}

.tool:hover{
  background:var(--panel3);
  color:white;
}

.tool.active{
  background:rgba(117,104,255,.13);
  border-color:rgba(117,104,255,.3);
  color:white;
}

.tool-icon{
  width:25px;
  text-align:center;
  font-size:17px;
}

.tool strong{
  display:block;
  font-size:12px;
}

.tool small{
  color:#707a88;
  font-size:9px;
}

/* ================= CENTER ================= */

.center{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#090b0f;
}

.canvas-area{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at 50% 45%,
      #1c222c 0,
      #0d1117 42%,
      #07080c 82%
    );
}

.checker{
  position:absolute;
  inset:0;
  opacity:.11;
  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:35px 35px;
  mask-image:
    linear-gradient(
      to bottom,
      transparent,
      #000 25%,
      #000 75%,
      transparent
    );
}

.stage{
  width:min(86%,1000px);
  height:min(78%,700px);
  position:relative;
  background:#000;
  border:1px solid #2a303a;
  border-radius:5px;
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
}

#canvas{
  width:100%;
  height:100%;
  display:block;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  color:#788290;
  pointer-events:none;
}

.empty-icon{
  font-size:55px;
  opacity:.65;
}

.empty strong{
  color:#d9dee5;
  font-size:14px;
}

.empty span{
  font-size:11px;
}

/* ================= CANVAS BAR ================= */

.canvas-bar{
  position:absolute;
  bottom:17px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:4px;
  padding:5px;
  background:rgba(12,15,20,.9);
  border:1px solid var(--line);
  border-radius:10px;
  backdrop-filter:blur(15px);
  z-index:10;
}

.canvas-bar button{
  min-width:35px;
  height:31px;
  border-radius:7px;
  background:transparent;
  color:#d2d7df;
}

.canvas-bar button:hover{
  background:var(--panel3);
}

/* ================= BOTTOM ================= */

.bottom{
  height:44px;
  flex:none;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:9px;
  background:#0d1015;
  border-top:1px solid var(--line);
  color:#788290;
  font-size:10px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(53,211,154,.6);
}

.bottom-right{
  margin-left:auto;
}

/* ================= RIGHT PANEL ================= */

.section{
  padding-bottom:17px;
  margin-bottom:17px;
  border-bottom:1px solid rgba(255,255,255,.055);
}

.section:last-child{
  border-bottom:0;
}

.section-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  color:#c2c9d3;
  font-size:10px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.control{
  margin-bottom:13px;
}

.control:last-child{
  margin-bottom:0;
}

.control label{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
  color:#8c95a2;
  font-size:10px;
}

.output{
  color:#d6dce4;
}

.range{
  width:100%;
  height:4px;
  appearance:none;
  background:#2a303a;
  border-radius:5px;
}

.range::-webkit-slider-thumb{
  appearance:none;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  border:3px solid var(--accent);
}

.range::-moz-range-thumb{
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  border:3px solid var(--accent);
}

.select,
.text-input{
  width:100%;
  height:36px;
  padding:0 9px;
  border-radius:7px;
  border:1px solid var(--line);
  background:#151a21;
  color:#edf1f5;
  font-size:11px;
}

.upload{
  width:100%;
  min-height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  border:1px dashed #424b59;
  border-radius:10px;
  background:linear-gradient(145deg,#11151c,#0d1015);
  color:#929ba7;
  cursor:pointer;
  transition:.2s;
}

.upload:hover,
.upload.drag{
  border-color:var(--accent);
  background:rgba(117,104,255,.08);
}

.upload-icon{
  font-size:32px;
}

.upload strong{
  color:#e7ebf0;
  font-size:12px;
}

.upload small{
  font-size:9px;
}

#file{
  display:none;
}

/* ================= THEMES ================= */

.theme-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.theme{
  height:52px;
  position:relative;
  overflow:hidden;
  border-radius:7px;
  border:1px solid var(--line);
  color:white;
  cursor:pointer;
}

.theme span{
  position:absolute;
  left:5px;
  right:5px;
  bottom:4px;
  font-size:8px;
  text-shadow:0 1px 5px #000;
}

.theme:nth-child(1){
  background:linear-gradient(135deg,#555,#171717);
}

.theme:nth-child(2){
  background:linear-gradient(135deg,#ffb36b,#7b4bff);
}

.theme:nth-child(3){
  background:linear-gradient(135deg,#00c6ff,#0072ff);
}

.theme:nth-child(4){
  background:linear-gradient(135deg,#434343,#000);
}

.theme:nth-child(5){
  background:linear-gradient(135deg,#ff9966,#ff5e62);
}

.theme:nth-child(6){
  background:linear-gradient(135deg,#f857a6,#ff5858);
}

.theme.active{
  border:2px solid white;
}

/* ================= TEXT ================= */

.presets{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:9px;
}

.preset{
  height:39px;
  border-radius:7px;
  border:1px solid var(--line);
  background:var(--panel3);
  color:white;
  font-size:10px;
}

.preset:hover{
  border-color:var(--accent);
}

/* ================= STICKERS ================= */

.stickers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.sticker{
  height:45px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:var(--panel3);
  border:1px solid var(--line);
  font-size:22px;
}

.sticker:hover{
  transform:scale(1.05);
  border-color:var(--accent);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:grid;
}

.modal-box{
  width:min(500px,92%);
  background:#11151b;
  border:1px solid #343b47;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.modal-head{
  height:55px;
  padding:0 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.modal-head strong{
  font-size:13px;
}

.modal-body{
  padding:18px;
}

.export-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:16px;
}

.export-option{
  padding:15px;
  text-align:left;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--panel3);
  color:white;
}

.export-option.active{
  border-color:var(--accent);
  background:rgba(117,104,255,.12);
}

.export-option strong{
  display:block;
  font-size:12px;
  margin-bottom:4px;
}

.export-option small{
  color:var(--muted);
  font-size:9px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:20px;
  bottom:64px;
  z-index:200;
  padding:11px 15px;
  border-radius:9px;
  border:1px solid #3a424f;
  background:#171c23;
  color:white;
  font-size:11px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:1050px){
  .workspace{
    grid-template-columns:210px minmax(0,1fr) 250px;
  }

  .project{
    display:none;
  }
}

@media(max-width:800px){

  html,
  body{
    overflow:auto;
  }

  .workspace{
    display:flex;
    flex-direction:column;
    overflow:auto;
  }

  .sidebar{
    flex:none;
  }

  .left{
    max-height:220px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .right{
    max-height:500px;
    border-left:0;
    border-top:1px solid var(--line);
  }

  .center{
    min-height:520px;
  }

  .stage{
    width:94%;
    height:72%;
  }

  .top-actions .btn:not(.primary){
    display:none;
  }
}

@media(max-width:480px){

  .topbar{
    padding:0 9px;
    gap:8px;
  }

  .logo{
    font-size:15px;
  }

  .logo-mark{
    width:28px;
    height:28px;
  }

  .top-actions{
    gap:4px;
  }

  .icon-btn{
    width:32px;
  }

  .btn.primary{
    padding:0 9px;
  }

  .canvas-bar{
    bottom:8px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= TOP BAR ================= -->

<header class="topbar">

  <div class="logo">
    <div class="logo-mark">✦</div>
    Pixel<span>Forge</span> AI
  </div>

  <div class="project">
    Untitled Photo Project
  </div>

  <div class="top-actions">

    <button class="icon-btn" id="undoBtn">
      ↶
    </button>

    <button class="icon-btn" id="redoBtn">
      ↷
    </button>

    <button class="btn" id="resetBtn">
      Reset
    </button>

    <button class="btn primary" id="exportBtn">
      Export
    </button>

  </div>

</header>


<!-- ================= WORKSPACE ================= -->

<div class="workspace">


<!-- ================= LEFT ================= -->

<aside class="sidebar left">

  <div class="panel-title">
    TOOLS
  </div>

  <div class="panel-content">

    <input
      class="search"
      id="toolSearch"
      placeholder="Search tools..."
    >

    <div class="tools">

      <button class="tool active">
        <span class="tool-icon">✨</span>
        <span>
          <strong>AI Enhance</strong>
          <small>Improve details</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">◒</span>
        <span>
          <strong>Adjust</strong>
          <small>Light & color</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">🎨</span>
        <span>
          <strong>Filters</strong>
          <small>Creative looks</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">T</span>
        <span>
          <strong>Text</strong>
          <small>Typography</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">⭐</span>
        <span>
          <strong>Stickers</strong>
          <small>Decorations</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">✦</span>
        <span>
          <strong>Effects</strong>
          <small>Visual effects</small>
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">⌗</span>
        <span>
          <strong>Crop</strong>
          <small>Frame & rotate</small>
        </span>
      </button>

    </div>

  </div>

</aside>


<!-- ================= CENTER ================= -->

<main class="center">

  <div class="canvas-area">

    <div class="checker"></div>

    <div class="stage">

      <canvas id="canvas"></canvas>

      <div class="empty" id="empty">

        <div class="empty-icon">
          ⌁
        </div>

        <strong>
          Upload a photo to start
        </strong>

        <span>
          Drag & drop an image or use Upload Photo
        </span>

      </div>

    </div>


    <div class="canvas-bar">

      <button id="zoomOut">
        −
      </button>

      <button id="zoomDisplay">
        100%
      </button>

      <button id="zoomIn">
        +
      </button>

      <button id="fitBtn">
        ⛶
      </button>

      <button id="beforeBtn">
        ◐
      </button>

    </div>

  </div>


  <div class="bottom">

    <span class="status-dot"></span>

    <span id="status">
      Ready
    </span>

    <span class="bottom-right">

      <span id="resolution">
        No image
      </span>

      &nbsp;•&nbsp;

      <span id="zoomLabel">
        100%
      </span>

    </span>

  </div>

</main>


<!-- ================= RIGHT ================= -->

<aside class="sidebar right">

  <div class="panel-title">
    PROPERTIES
  </div>

  <div class="panel-content">


    <!-- SOURCE -->

    <section class="section">

      <div class="section-title">
        <span>Source</span>
      </div>

      <label
        class="upload"
        id="dropZone"
      >

        <input
          id="file"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <div class="upload-icon">
          ↥
        </div>

        <strong>
          Upload Photo
        </strong>

        <small>
          JPG • PNG • WEBP
        </small>

      </label>

    </section>


    <!-- AI -->

    <section class="section">

      <div class="section-title">
        <span>AI Enhancement</span>
        <span>AI</span>
      </div>

      <div class="control">

        <label>
          <span>Enhancement</span>
          <span class="output" id="enhanceValue">75</span>
        </label>

        <input
          class="range"
          id="enhance"
          type="range"
          min="0"
          max="100"
          value="75"
        >

      </div>

      <div class="control">

        <label>
          <span>Detail</span>
          <span class="output" id="detailValue">50</span>
        </label>

        <input
          class="range"
          id="detail"
          type="range"
          min="0"
          max="100"
          value="50"
        >

      </div>

      <div class="control">

        <label>
          <span>Noise Reduction</span>
          <span class="output" id="noiseValue">20</span>
        </label>

        <input
          class="range"
          id="noise"
          type="range"
          min="0"
          max="100"
          value="20"
        >

      </div>

    </section>


    <!-- COLOR -->

    <section class="section">

      <div class="section-title">
        <span>Color</span>
      </div>

      <div class="control">

        <label>
          <span>Brightness</span>
          <span class="output" id="brightnessValue">0</span>
        </label>

        <input
          class="range"
          id="brightness"
          type="range"
          min="-100"
          max="100"
          value="0"
        >

      </div>

      <div class="control">

        <label>
          <span>Contrast</span>
          <span class="output" id="contrastValue">0</span>
        </label>

        <input
          class="range"
          id="contrast"
          type="range"
          min="-100"
          max="100"
          value="0"
        >

      </div>

      <div class="control">

        <label>
          <span>Saturation</span>
          <span class="output" id="saturationValue">0</span>
        </label>

        <input
          class="range"
          id="saturation"
          type="range"
          min="-100"
          max="100"
          value="0"
        >

      </div>

    </section>


    <!-- FILTERS -->

    <section class="section">

      <div class="section-title">
        <span>Filters</span>
      </div>

      <div class="theme-grid">

        <button
          class="theme active"
          data-filter="none"
        >
          <span>Original</span>
        </button>

        <button
          class="theme"
          data-filter="warm"
        >
          <span>Warm</span>
        </button>

        <button
          class="theme"
          data-filter="cool"
        >
          <span>Cool</span>
        </button>

        <button
          class="theme"
          data-filter="cinema"
        >
          <span>Cinema</span>
        </button>

        <button
          class="theme"
          data-filter="vintage"
        >
          <span>Vintage</span>
        </button>

        <button
          class="theme"
          data-filter="neon"
        >
          <span>Neon</span>
        </button>

      </div>

    </section>


    <!-- TEXT -->

    <section class="section">

      <div class="section-title">
        <span>Text</span>
      </div>

      <input
        class="text-input"
        id="textInput"
        placeholder="Enter text..."
      >

      <div class="presets">

        <button
          class="preset"
          data-style="minimal"
        >
          Minimal
        </button>

        <button
          class="preset"
          data-style="bold"
        >
          Bold
        </button>

        <button
          class="preset"
          data-style="neon"
        >
          Neon
        </button>

        <button
          class="preset"
          data-style="shadow"
        >
          Shadow
        </button>

      </div>

    </section>


    <!-- STICKERS -->

    <section class="section">

      <div class="section-title">
        <span>Stickers</span>
      </div>

      <div class="stickers">

        <button class="sticker">🔥</button>
        <button class="sticker">✨</button>
        <button class="sticker">❤️</button>
        <button class="sticker">⭐</button>
        <button class="sticker">💎</button>
        <button class="sticker">🌈</button>
        <button class="sticker">⚡</button>
        <button class="sticker">🎀</button>

      </div>

    </section>


    <!-- OUTPUT -->

    <section class="section">

      <div class="section-title">
        <span>Export Quality</span>
      </div>

      <select
        class="select"
        id="output"
      >

        <option value="4k">
          4K UHD — 3840 × 2160
        </option>

        <option value="1080">
          Full HD — 1920 × 1080
        </option>

        <option value="original">
          Original Resolution
        </option>

      </select>

    </section>

  </div>

</aside>

</div>

</div>


<!-- ================= EXPORT MODAL ================= -->

<div
  class="modal"
  id="exportModal"
>

  <div class="modal-box">

    <div class="modal-head">

      <strong>
        Export Image
      </strong>

      <button
        class="icon-btn"
        id="closeModal"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="export-grid">

        <button
          class="export-option active"
          data-resolution="4k"
        >

          <strong>
            4K UHD
          </strong>

          <small>
            3840 × 2160
          </small>

        </button>

        <button
          class="export-option"
          data-resolution="1080"
        >

          <strong>
            Full HD
          </strong>

          <small>
            1920 × 1080
          </small>

        </button>

      </div>

      <button
        class="btn primary"
        id="downloadBtn"
        style="width:100%;height:43px"
      >
        Download PNG
      </button>

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast"
>
  Done
</div>


<script>
"use strict";

/* =========================================================
   PIXELFORGE AI ENGINE
   ========================================================= */

const App = {

  canvas:null,
  ctx:null,

  image:null,
  original:null,

  zoom:1,
  showingBefore:false,

  filter:"none",
  text:"",
  textStyle:"minimal",

  stickers:[],

  exportResolution:"4k",

  settings:{
    enhance:75,
    detail:50,
    noise:20,
    brightness:0,
    contrast:0,
    saturation:0
  },

  init(){

    this.canvas =
      document.getElementById("canvas");

    this.ctx =
      this.canvas.getContext("2d");

    this.bindUpload();
    this.bindSliders();
    this.bindFilters();
    this.bindText();
    this.bindStickers();
    this.bindTools();
    this.bindExport();

    this.resize();

    window.addEventListener(
      "resize",
      ()=>{
        this.resize();
        this.render();
      }
    );

    this.setStatus("Ready");

  },


  /* ================= UPLOAD ================= */

  bindUpload(){

    const zone =
      document.getElementById("dropZone");

    const input =
      document.getElementById("file");


    zone.addEventListener(
      "click",
      ()=>{
        input.click();
      }
    );


    input.addEventListener(
      "change",
      event=>{

        const file =
          event.target.files[0];

        if(file){
          this.load(file);
        }

      }
    );


    zone.addEventListener(
      "dragover",
      event=>{

        event.preventDefault();

        zone.classList.add("drag");

      }
    );


    zone.addEventListener(
      "dragleave",
      ()=>{
        zone.classList.remove("drag");
      }
    );


    zone.addEventListener(
      "drop",
      event=>{

        event.preventDefault();

        zone.classList.remove("drag");

        const file =
          event.dataTransfer.files[0];

        if(
          file &&
          file.type.startsWith("image/")
        ){
          this.load(file);
        }

      }
    );

  },


  load(file){

    if(
      !file.type.startsWith("image/")
    ){

      this.toast("Please select an image");

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      event=>{

        const img =
          new Image();


        img.onload =
          ()=>{

            this.image = img;
            this.original = img;

            this.zoom = 1;

            document
              .getElementById("empty")
              .style.display = "none";


            document
              .getElementById("resolution")
              .textContent =
                img.naturalWidth +
                " × " +
                img.naturalHeight;


            this.resize();

            this.render();

            this.setStatus("Photo loaded");

            this.toast("Photo loaded successfully");

          };


        img.src =
          event.target.result;

      };


    reader.readAsDataURL(file);

  },


  /* ================= CANVAS ================= */

  resize(){

    const rect =
      this.canvas
        .parentElement
        .getBoundingClientRect();


    this.canvas.width =
      Math.max(
        1,
        Math.floor(rect.width)
      );

    this.canvas.height =
      Math.max(
        1,
        Math.floor(rect.height)
      );

  },


  render(){

    const ctx = this.ctx;

    const canvas = this.canvas;


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if(!this.image){
      return;
    }


    const image =
      this.showingBefore
        ? this.original
        : this.image;


    const iw =
      image.naturalWidth;

    const ih =
      image.naturalHeight;


    const scale =
      Math.min(
        canvas.width / iw,
        canvas.height / ih
      );


    const width =
      iw * scale * this.zoom;

    const height =
      ih * scale * this.zoom;


    const x =
      (canvas.width - width) / 2;

    const y =
      (canvas.height - height) / 2;


    ctx.save();


    if(!this.showingBefore){

      let brightness =
        100 + this.settings.brightness;

      let contrast =
        100 + this.settings.contrast;

      let saturation =
        100 + this.settings.saturation;


      /*
       * Enhancement simulation:
       * Detail increases contrast slightly.
       */

      contrast +=
        this.settings.detail * .08;

      saturation +=
        this.settings.enhance * .05;


      let filter =
        "brightness(" +
        brightness +
        "%) " +
        "contrast(" +
        contrast +
        "%) " +
        "saturate(" +
        saturation +
        "%)";


      if(this.filter === "warm"){
        filter +=
          " sepia(15%) saturate(115%)";
      }


      if(this.filter === "cool"){
        filter +=
          " hue-rotate(12deg) saturate(110%)";
      }


      if(this.filter === "cinema"){
        filter +=
          " contrast(115%) saturate(88%)";
      }


      if(this.filter === "vintage"){
        filter +=
          " sepia(30%) contrast(105%)";
      }


      if(this.filter === "neon"){
        filter +=
          " saturate(155%) contrast(115%)";
      }


      ctx.filter = filter;

    }


    ctx.drawImage(
      image,
      x,
      y,
      width,
      height
    );


    ctx.restore();


    this.drawText();
    this.drawStickers();

  },


  /* ================= TEXT ================= */

  bindText(){

    const input =
      document.getElementById("textInput");


    input.addEventListener(
      "input",
      ()=>{
        this.text =
          input.value;

        this.render();
      }
    );


    document
      .querySelectorAll(".preset")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            this.textStyle =
              button.dataset.style;

            this.render();

            this.toast(
              button.textContent +
              " text style selected"
            );

          }
        );

      });

  },


  drawText(){

    if(!this.text){
      return;
    }


    const ctx = this.ctx;

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    let size = 44;
    let weight = 700;


    if(this.textStyle === "minimal"){
      size = 42;
      weight = 500;
    }


    if(this.textStyle === "bold"){
      size = 56;
      weight = 900;
    }


    if(this.textStyle === "neon"){

      size = 48;
      weight = 800;

      ctx.shadowColor =
        "#766cff";

      ctx.shadowBlur = 24;

    }


    if(this.textStyle === "shadow"){

      size = 48;
      weight = 800;

      ctx.shadowColor =
        "rgba(0,0,0,.9)";

      ctx.shadowBlur = 18;

      ctx.shadowOffsetY = 7;

    }


    ctx.font =
      weight +
      " " +
      size +
      "px Arial";


    ctx.fillStyle =
      "#ffffff";


    ctx.fillText(
      this.text,
      this.canvas.width / 2,
      this.canvas.height * .82
    );


    ctx.restore();

  },


  /* ================= STICKERS ================= */

  bindStickers(){

    document
      .querySelectorAll(".sticker")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            this.stickers.push({
              value:button.textContent,
              x:.5,
              y:.5
            });

            this.render();

            this.toast("Sticker added");

          }
        );

      });

  },


  drawStickers(){

    const ctx = this.ctx;

    ctx.save();

    this.stickers.forEach(
      sticker=>{

        ctx.font =
          "55px sans-serif";

        ctx.textAlign =
          "center";

        ctx.textBaseline =
          "middle";


        ctx.fillText(
          sticker.value,
          this.canvas.width * sticker.x,
          this.canvas.height * sticker.y
        );

      }
    );


    ctx.restore();

  },


  /* ================= SLIDERS ================= */

  bindSliders(){

    const ids = [
      "enhance",
      "detail",
      "noise",
      "brightness",
      "contrast",
      "saturation"
    ];


    ids.forEach(id=>{

      const input =
        document.getElementById(id);

      const output =
        document.getElementById(
          id + "Value"
        );


      input.addEventListener(
        "input",
        ()=>{

          this.settings[id] =
            Number(input.value);

          output.textContent =
            input.value;

          this.render();

        }
      );

    });

  },


  /* ================= FILTERS ================= */

  bindFilters(){

    document
      .querySelectorAll(".theme")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            document
              .querySelectorAll(".theme")
              .forEach(x=>{
                x.classList.remove("active");
              });


            button.classList.add("active");


            this.filter =
              button.dataset.filter;


            this.render();


            this.toast(
              button.textContent.trim() +
              " filter applied"
            );

          }
        );

      });

  },


  /* ================= TOOLS ================= */

  bindTools(){

    const tools =
      document.querySelectorAll(".tool");


    tools.forEach(tool=>{

      tool.addEventListener(
        "click",
        ()=>{

          tools.forEach(x=>{
            x.classList.remove("active");
          });


          tool.classList.add("active");


          const title =
            tool.querySelector("strong");


          if(title){
            this.toast(
              title.textContent +
              " selected"
            );
          }

        }
      );

    });


    const search =
      document.getElementById(
        "toolSearch"
      );


    search.addEventListener(
      "input",
      ()=>{

        const query =
          search.value
            .toLowerCase()
            .trim();


        tools.forEach(tool=>{

          tool.style.display =
            tool.textContent
              .toLowerCase()
              .includes(query)
                ? "flex"
                : "none";

        });

      }
    );


    document
      .getElementById("zoomIn")
      .addEventListener(
        "click",
        ()=>{
          this.zoom =
            Math.min(
              3,
              this.zoom + .1
            );

          this.updateZoom();

        }
      );


    document
      .getElementById("zoomOut")
      .addEventListener(
        "click",
        ()=>{
          this.zoom =
            Math.max(
              .25,
              this.zoom - .1
            );

          this.updateZoom();

        }
      );


    document
      .getElementById("fitBtn")
      .addEventListener(
        "click",
        ()=>{
          this.zoom = 1;
          this.updateZoom();
        }
      );


    const before =
      document.getElementById(
        "beforeBtn"
      );


    before.addEventListener(
      "mousedown",
      ()=>{
        this.showingBefore = true;
        this.render();
      }
    );


    before.addEventListener(
      "mouseup",
      ()=>{
        this.showingBefore = false;
        this.render();
      }
    );


    before.addEventListener(
      "mouseleave",
      ()=>{
        this.showingBefore = false;
        this.render();
      }
    );


    before.addEventListener(
      "touchstart",
      ()=>{
        this.showingBefore = true;
        this.render();
      }
    );


    before.addEventListener(
      "touchend",
      ()=>{
        this.showingBefore = false;
        this.render();
      }
    );


    document
      .getElementById("resetBtn")
      .addEventListener(
        "click",
        ()=>this.reset()
      );


    document
      .getElementById("undoBtn")
      .addEventListener(
        "click",
        ()=>{
          this.toast("Undo ready");
        }
      );


    document
      .getElementById("redoBtn")
      .addEventListener(
        "click",
        ()=>{
          this.toast("Redo ready");
        }
      );

  },


  updateZoom(){

    const value =
      Math.round(
        this.zoom * 100
      ) + "%";


    document
      .getElementById("zoomDisplay")
      .textContent = value;


    document
      .getElementById("zoomLabel")
      .textContent = value;


    this.render();

  },


  /* ================= RESET ================= */

  reset(){

    this.settings = {
      enhance:75,
      detail:50,
      noise:20,
      brightness:0,
      contrast:0,
      saturation:0
    };


    this.filter = "none";

    this.text = "";

    this.textStyle = "minimal";

    this.stickers = [];

    this.zoom = 1;


    const values = {
      enhance:75,
      detail:50,
      noise:20,
      brightness:0,
      contrast:0,
      saturation:0
    };


    Object.keys(values).forEach(id=>{

      const input =
        document.getElementById(id);

      const output =
        document.getElementById(
          id + "Value"
        );


      input.value =
        values[id];

      output.textContent =
        values[id];

    });


    document
      .getElementById("textInput")
      .value = "";


    document
      .querySelectorAll(".theme")
      .forEach(x=>{
        x.classList.remove("active");
      });


    document
      .querySelector(
        '[data-filter="none"]'
      )
      .classList.add("active");


    this.updateZoom();

    this.toast("Edits reset");

  },


  /* ================= EXPORT ================= */

  bindExport(){

    document
      .getElementById("exportBtn")
      .addEventListener(
        "click",
        ()=>{
          this.openExport();
        }
      );


    document
      .getElementById("closeModal")
      .addEventListener(
        "click",
        ()=>{
          this.closeExport();
        }
      );


    document
      .getElementById("downloadBtn")
      .addEventListener(
        "click",
        ()=>{
          this.exportImage();
        }
      );


    document
      .querySelectorAll(".export-option")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            document
              .querySelectorAll(
                ".export-option"
              )
              .forEach(x=>{
                x.classList.remove(
                  "active"
                );
              });


            button.classList.add("active");


            this.exportResolution =
              button.dataset.resolution;

          }
        );

      });

  },


  openExport(){

    if(!this.image){

      this.toast(
        "Upload a photo first"
      );

      return;

    }


    document
      .getElementById("exportModal")
      .classList.add("show");

  },


  closeExport(){

    document
      .getElementById("exportModal")
      .classList.remove("show");

  },


  exportImage(){

    if(!this.image){

      this.toast(
        "Upload a photo first"
      );

      return;

    }


    const originalWidth =
      this.image.naturalWidth;

    const originalHeight =
      this.image.naturalHeight;


    let width;
    let height;


    if(
      this.exportResolution ===
      "original"
    ){

      width =
        originalWidth;

      height =
        originalHeight;

    }
    else if(
      this.exportResolution ===
      "1080"
    ){

      width = 1920;
      height = 1080;

    }
    else{

      width = 3840;
      height = 2160;

    }


    const output =
      document.createElement("canvas");


    output.width = width;
    output.height = height;


    const ctx =
      output.getContext("2d");


    const iw =
      this.image.naturalWidth;

    const ih =
      this.image.naturalHeight;


    const scale =
      Math.min(
        width / iw,
        height / ih
      );


    const w =
      iw * scale;

    const h =
      ih * scale;


    const x =
      (width - w) / 2;

    const y =
      (height - h) / 2;


    let brightness =
      100 + this.settings.brightness;

    let contrast =
      100 + this.settings.contrast;

    let saturation =
      100 + this.settings.saturation;


    contrast +=
      this.settings.detail * .08;

    saturation +=
      this.settings.enhance * .05;


    let filter =
      "brightness(" +
      brightness +
      "%) " +
      "contrast(" +
      contrast +
      "%) " +
      "saturate(" +
      saturation +
      "%)";


    if(this.filter === "warm"){
      filter +=
        " sepia(15%) saturate(115%)";
    }


    if(this.filter === "cool"){
      filter +=
        " hue-rotate(12deg) saturate(110%)";
    }


    if(this.filter === "cinema"){
      filter +=
        " contrast(115%) saturate(88%)";
    }


    if(this.filter === "vintage"){
      filter +=
        " sepia(30%) contrast(105%)";
    }


    if(this.filter === "neon"){
      filter +=
        " saturate(155%) contrast(115%)";
    }


    ctx.filter = filter;


    ctx.drawImage(
      this.image,
      x,
      y,
      w,
      h
    );


    ctx.filter = "none";


    /* TEXT */

    if(this.text){

      ctx.save();

      let size =
        Math.round(
          width * .035
        );


      let weight = 800;


      if(this.textStyle === "minimal"){
        weight = 500;
      }


      if(this.textStyle === "bold"){
        size =
          Math.round(
            width * .045
          );
      }


      ctx.font =
        weight +
        " " +
        size +
        "px Arial";


      ctx.textAlign = "center";
      ctx.textBaseline = "middle";


      if(this.textStyle === "neon"){

        ctx.shadowColor =
          "#766cff";

        ctx.shadowBlur = 28;

      }


      if(this.textStyle === "shadow"){

        ctx.shadowColor =
          "rgba(0,0,0,.9)";

        ctx.shadowBlur = 20;

        ctx.shadowOffsetY = 8;

      }


      ctx.fillStyle =
        "#ffffff";


      ctx.fillText(
        this.text,
        width / 2,
        height * .82
      );


      ctx.restore();

    }


    /* STICKERS */

    this.stickers.forEach(
      sticker=>{

        ctx.save();

        ctx.font =
          Math.round(
            width * .045
          ) +
          "px sans-serif";

        ctx.textAlign =
          "center";

        ctx.textBaseline =
          "middle";


        ctx.fillText(
          sticker.value,
          width * sticker.x,
          height * sticker.y
        );


        ctx.restore();

      }
    );


    output.toBlob(
      blob=>{

        if(!blob){

          this.toast(
            "Export failed"
          );

          return;

        }


        const url =
          URL.createObjectURL(blob);


        const link =
          document.createElement("a");


        link.href = url;

        link.download =
          "pixelforge-" +
          width +
          "x" +
          height +
          ".png";


        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(
          ()=>{
            URL.revokeObjectURL(url);
          },
          1000
        );


        this.closeExport();

        this.toast(
          "Export completed"
        );

      },
      "image/png"
    );

  },


  /* ================= STATUS ================= */

  setStatus(text){

    document
      .getElementById("status")
      .textContent = text;

  },


  toast(message){

    const toast =
      document.getElementById(
        "toast"
      );


    toast.textContent =
      message;


    toast.classList.add("show");


    clearTimeout(
      this.toastTimer
    );


    this.toastTimer =
      setTimeout(
        ()=>{
          toast.classList.remove(
            "show"
          );
        },
        2200
      );

  }

};


/* ================= START ================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    App.init();
  }
);


/* ================= ESCAPE ================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key === "Escape"){

      document
        .getElementById(
          "exportModal"
        )
        .classList.remove("show");

    }

  }
);

</script>
